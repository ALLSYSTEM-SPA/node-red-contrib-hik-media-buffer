<script type="text/javascript">
    RED.nodes.registerType('hik-snapshot', {
        category: 'Hikvision',
        color: '#00b4d8',
        defaults: {
            name: { value: "" },
            host: { value: "", required: true },
            channel: {value: "", required: true},
            protocol: { value: "http" },
            port: { value: "80", required: true },
            user: { value: "admin", required: true },
            pass: { value: "" },

        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-picture-o",
        label: function() { return this.name || "Hik Snapshot"; },
        
    });
</script>

<script type="text/html" data-template-name="hik-snapshot">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nome</label>
        <input type="text" id="node-input-name">
    </div>
    
    <hr>
    <h4>Configurazione NVR</h4>
    <div class="form-row">
        <label for="node-input-host"><i class="fa fa-globe"></i> IP NVR</label>
        <input type="text" id="node-input-host" placeholder="Es: 192.168.1.100">
    </div>

    <div class="form-row">
        <label for="node-input-channel"><i class="fa fa-list-ol"></i> Numero Canali</label>
        <input type="number" id="node-input-channel" min="1" max="64">
    </div>

    <div class="form-row">
        <label for="node-input-user"><i class="fa fa-user"></i> Utente</label>
        <input type="text" id="node-input-user">
    </div>

    <div class="form-row">
        <label for="node-input-pass"><i class="fa fa-lock"></i> Password NVR</label>
        <input type="password" id="node-input-pass">
    </div>

    <div class="form-row">
        <label for="node-input-protocol"><i class="fa fa-shield"></i> Protocollo</label>
        <select id="node-input-protocol" style="width: 70%">
            <option value="http">HTTP</option>
            <option value="https">HTTPS</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-plug"></i> Porta</label>
        <select id="node-input-port" style="width: 70%">
            <option value="80">80</option>
            <option value="443">443</option>
            <option value="85">85</option>
            <option value="8000">8000</option>
            <option value="8008">8008</option>
        </select>
    </div>

</script>
<script type="text/markdown" data-help-name="hik-snapshot">
## HIK SNAPSHOT NODE

<img src='https://raw.githubusercontent.com/ALLSYSTEM-SPA/node-red-contrib-hik-media-buffer/main/img/hik-snapshot-node.png'>

The Hik Snapshot node connects to NVR and generates a live image for each camera when it receives payload = true as input.
This node can also report if there are recordings of the day this node is triggered for each camera.

<img src='https://raw.githubusercontent.com/ALLSYSTEM-SPA/node-red-contrib-hik-media-buffer/main/img/hik-snapshot-configuration.png'>

To configure the node you need to enter the IP, user and password of the NVR, you can also choose the protocol and port to use.</br>
You must also enter the number of the channels you want to get the snapshot of.</br>
If you enter "5", you will get the output of the first 5 channels on the NVR, so if you have 5 cameras on the NVR but one of them is not on the first five channels you won't get the snapshot of that camera.</br>

This below is an example of msg output:</br>

```javascript
msg = {
payload: array[5], // 5 channels
0: object, 
channel: 1, // Channel 1 of the NVR
photo: buffer[18080], // Snapshot buffer
snapOk: true, // True if it gets the snapshot, False if not
isRecording: true, // True if it the camera recorded something that day, False if not
1: object,
channel: 2,
photo: buffer[35056],
snapOk: true,
isRecording: true,
2: object,
3: object,
4: object
}
```
</script>
